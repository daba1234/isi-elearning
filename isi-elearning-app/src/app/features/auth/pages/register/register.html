<main class="auth-page"><form class="auth-card" [formGroup]="form" (ngSubmit)="submit()"><span class="eyebrow">ISI E-Learning</span><h1>Creer un compte</h1><p>Rejoignez votre espace d'apprentissage.</p><div class="fields"><label> prenom <input formControlName="prenom" placeholder="Aminata"></label><label> Nom <input formControlName="nom" placeholder="Diallo"></label></div><label>Email <input type="email" formControlName="email" placeholder="vous@isi.sn"></label><label>Mot de passe <input type="password" formControlName="password" placeholder="6 caracteres minimum"></label><label>Je suis <select formControlName="role"><option value="etudiant">Etudiant</option><option value="enseignant">Enseignant</option></select></label><p class="error" *ngIf="error">{{ error }}</p><button [disabled]="loading">{{ loading ? 'Creation...' : 'Creer mon compte' }}</button><a routerLink="/login">Deja inscrit ? Se connecter</a></form></main>
