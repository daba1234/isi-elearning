<div class="courses-container">
  <div class="courses-header">
    <h1 class="courses-title">Mes Cours</h1>
    <button *ngIf="auth.currentUser()?.role === 'enseignant'" class="btn-new-course" routerLink="/courses/create">
      + Nouveau Cours
    </button>
  </div>

  <!-- État de chargement -->
  <div *ngIf="loading()" class="loading-state">
    <div class="spinner"></div>
    <p>Chargement des cours...</p>
  </div>

  <!-- Message d'erreur -->
  <div *ngIf="error()" class="error-alert">
    {{ error() }}
  </div>

  <!-- Liste des cours -->
  <div *ngIf="!loading() && courses().length > 0" class="courses-grid">
    <div *ngFor="let course of courses()" class="course-card" [routerLink]="['/courses', course.id]">
      <div class="course-header">
        <h2 class="course-title">{{ course.titre }}</h2>
        <span class="course-category">{{ course.categorie }}</span>
      </div>
      
      <p class="course-description">{{ course.description }}</p>
      
      <div class="course-footer">
        <button *ngIf="auth.currentUser()?.role === 'enseignant'" class="btn-publish" [class.published]="course.published"
          (click)="togglePublish(course, $event)">
          {{ course.published ? 'Publié' : 'Brouillon' }}
        </button>
        <button class="btn-view" [routerLink]="['/courses', course.id]">
          Voir les détails →
        </button>
      </div>
    </div>
  </div>

  <!-- Aucun cours -->
  <div *ngIf="!loading() && courses().length === 0" class="empty-state">
    <p>{{ auth.currentUser()?.role === 'enseignant' ? 'Aucun cours créé pour le moment' : 'Aucun cours disponible pour le moment' }}</p>
    <button *ngIf="auth.currentUser()?.role === 'enseignant'" class="btn-new-course" routerLink="/courses/create">
      Créer votre premier cours
    </button>
  </div>
</div>
